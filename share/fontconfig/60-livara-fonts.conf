<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Original Latin faces, a Vazirmatn-derived Persian face, then script fallback. -->
  <alias><family>sans-serif</family><prefer>
    <family>Livara Sans</family><family>Livara Persian</family><family>Noto Sans</family>
  </prefer></alias>
  <alias><family>monospace</family><prefer>
    <family>Livara Mono</family><family>Livara Persian</family><family>Noto Sans Mono</family>
  </prefer></alias>
  <alias><family>Livara Sans</family><accept>
    <family>Livara Persian</family><family>Noto Sans</family>
  </accept></alias>
  <alias><family>Livara Mono</family><accept>
    <family>Livara Persian</family><family>Noto Sans Mono</family>
  </accept></alias>
  <match target="pattern">
    <test name="family"><string>Livara Sans</string></test>
    <test name="lang" compare="contains"><string>fa</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Livara Persian</string></edit>
  </match>
</fontconfig>
