modules-search: [ local ]
sequence:
- show: [ welcome, locale, keyboard, partition, users, summary ]
- exec: [ partition, mount, unpackfs, machineid, fstab, locale, keyboard, localecfg, users, displaymanager, networkcfg, hwclock, livara, initramfscfg, initramfs, grubcfg, bootloader, umount ]
- show: [ finished ]
branding: livara
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: true
