name: Build and test Livara Browser
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: livara-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      LIVARA_BUILD_JOBS: '2'
      DOCKER_BUILDKIT: '1'
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare ephemeral runner disk and swap
        shell: bash
        run: |
          set -euo pipefail
          # Only disposable hosted-runner SDKs; never run this cleanup locally.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          df -h
          free -h
          available=$(df --output=avail -B1 /var/lib/docker | tail -1)
          test "$available" -ge 42949672960 || { echo 'At least 40 GiB free is required for this runner build.' >&2; exit 1; }
      - name: Compile actual pinned browser source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/forks dist/logs
          bash scripts/build-browser.sh dist/forks 2>&1 | tee dist/logs/browser-build.log
      - name: Launch compiled browser and test a local page
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-pil python3-psutil libdbus-glib-1-2 libgtk-3-0t64 libasound2t64
          python3 scripts/browser-runtime-smoke.py dist/forks/livara-browser-linux-x64.tar.xz dist/browser-test
      - name: Preserve complete build log and qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-build-logs-${{ github.run_attempt }}
          path: |
            dist/logs/
            dist/browser-test/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload compiled browser
        uses: actions/upload-artifact@v4
        with:
          name: livara-browser-linux-x64
          path: |
            dist/forks/livara-browser-linux-x64.tar.xz
            dist/forks/livara-browser-linux-x64.tar.xz.sha256
          compression-level: 0
          retention-days: 30
