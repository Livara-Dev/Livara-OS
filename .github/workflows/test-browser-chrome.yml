name: Qualify compiled Livara browser UI
on:
  workflow_dispatch:
    inputs:
      browser_run:
        description: Run containing the compiled browser candidate
        required: true
        type: string
  workflow_run:
    workflows: [Build and test Livara Browser]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  chrome:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth openbox python3-pil python3-psutil libdbus-glib-1-2 libgtk-3-0t64 libasound2t64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.browser_run || github.event.workflow_run.id }}
          name: livara-browser-compiled-candidate
          path: dist/forks
      - name: Check archive integrity
        run: cd dist/forks && sha256sum --check livara-browser-linux-x64.tar.xz.sha256
      - name: Apply current Livara chrome source to the compiled engine
        run: python3 scripts/refresh-browser-chrome.py dist/forks/livara-browser-linux-x64.tar.xz
      - name: Test real browser DOM, JavaScript, storage and rendering
        run: python3 scripts/browser-runtime-smoke.py dist/forks/livara-browser-linux-x64.tar.xz dist/browser-runtime
      - name: Test real browser chrome, preferences, dashboard and Tor controls
        run: python3 scripts/browser-chrome-smoke.py dist/forks/livara-browser-linux-x64.tar.xz dist/browser-chrome
      - name: Retain actual UI captures and runtime report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-chrome-proof
          path: |
            dist/browser-chrome/
            dist/browser-runtime/
          if-no-files-found: warn
          retention-days: 30
      - name: Export qualified browser for ISO assembly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livara-browser-linux-x64
          path: dist/forks/*
          compression-level: 0
          retention-days: 30
