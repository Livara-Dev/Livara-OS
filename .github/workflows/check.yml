name: Livara checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - name: Install font build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-fonttools gnupg gpgv libharfbuzz-bin python3-gi gir1.2-gdkpixbuf-2.0 librsvg2-common webp-pixbuf-loader
      - name: Rebuild editable fonts
        run: python3 scripts/build-fonts.py
      - name: Test tools and build scripts
        run: make check
      - name: Build desktop package
        run: make deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livara-desktop
          path: dist/*.deb

