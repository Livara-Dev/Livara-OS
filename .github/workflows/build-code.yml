name: Build and test Livara Code
on:
  workflow_call:
    inputs:
      reuse_run_id:
        description: 'Optional same-repository run with a preserved matching Code candidate'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Optional same-repository run with a preserved matching Code candidate'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: livara-code-${{ github.ref }}
  cancel-in-progress: false
jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      LIVARA_BUILD_JOBS: '2'
      LIVARA_BUILD_ID: github-code-${{ github.run_id }}
      DOCKER_BUILDKIT: '1'
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate optional candidate reuse
        id: candidate
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: python3 scripts/validate-code-reuse.py "$REUSE_RUN_ID"
      - name: Download matching compiled candidate
        if: steps.candidate.outputs.reuse == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id }}
          name: livara-code-compiled-candidate
          path: dist/forks
      - name: Verify reused source build before executing it
        if: steps.candidate.outputs.reuse == 'true'
        run: python3 scripts/package-code-update.py --check-only dist/forks/livara-code-linux-x64.tar.xz
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - name: Prepare ephemeral runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          cleanup_status=0
          timeout --kill-after=15s 180s sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || cleanup_status=$?
          if ((cleanup_status != 0 && cleanup_status != 124)); then exit "$cleanup_status"; fi
          if ((cleanup_status == 124)); then echo 'Cleanup time limit reached; continuing with the reclaimed space.'; fi
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          df -h
      - name: Install signed Ubuntu build dependencies with bounded waits
        run: |
          set -euo pipefail
          code_apt_dir=$(mktemp -d)
          chmod 755 "$code_apt_dir"
          trap 'rm -rf -- "$code_apt_dir"' EXIT
          cat > "$code_apt_dir/ubuntu.list" <<'SOURCES'
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          SOURCES
          apt_options=(-o "Dir::Etc::SourceList=$code_apt_dir/ubuntu.list" -o Dir::Etc::SourceParts=- -o Acquire::Retries=2 -o Acquire::https::Timeout=20)
          timeout --kill-after=15s 300s sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          timeout --kill-after=15s 300s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends python3-fonttools libharfbuzz-bin libgtk-3-0t64 libnss3 libasound2t64 libxss1 libgbm1 xvfb xauth xdotool openbox x11-utils python3-pil python3-psutil
          python3 scripts/build-fonts.py
          df -h
          free -h
      - name: Compile actual pinned Code source
        if: steps.candidate.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/logs dist/forks
          bash scripts/build-code.sh dist/forks 2>&1 | tee dist/logs/code-build.log
      - name: Preserve compiled candidate before runtime testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livara-code-compiled-candidate
          path: |
            dist/forks/livara-code-linux-x64.tar.xz
            dist/forks/livara-code-linux-x64.tar.xz.sha256
          compression-level: 0
          retention-days: 30
      - name: Test packaged CLI and native window
        run: |
          set -euo pipefail
          python3 scripts/code-runtime-smoke.py dist/forks/livara-code-linux-x64.tar.xz dist/code-test
      - name: Package tested Code-only application update
        run: python3 scripts/package-code-update.py dist/forks/livara-code-linux-x64.tar.xz
      - name: Upload Code-only DEB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livara-code-update
          path: dist/update-code/*.deb
          compression-level: 0
          retention-days: 30
      - name: Preserve logs and test proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-build-logs-${{ github.run_attempt }}
          path: |
            dist/logs/
            dist/code-test/
            .build/code-reuse.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload compiled editor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livara-code-linux-x64
          path: |
            dist/forks/livara-code-linux-x64.tar.xz
            dist/forks/livara-code-linux-x64.tar.xz.sha256
            dist/forks/livara-code-build.json
          compression-level: 0
          retention-days: 30
