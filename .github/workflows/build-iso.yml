name: Build, boot-test and publish Livara ISO
on:
  workflow_dispatch:
    inputs:
      browser_run:
        description: Successful browser build run ID
        required: true
        type: string
      code_run:
        description: Successful editor build run ID
        required: true
        type: string
  workflow_run:
    workflows: [Qualify compiled Livara browser UI]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: livara-iso-release
  cancel-in-progress: false
jobs:
  iso:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    env:
      LIVARA_BUILD_JOBS: '2'
      DOCKER_BUILDKIT: '1'
      BUILDKIT_PROGRESS: plain
      # Source-built 1.143.1: CLI and sandboxed native window checks passed.
      LIVARA_CODE_RUN: '39940915546'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source application build runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BROWSER_RUN: ${{ inputs.browser_run || github.event.workflow_run.id }}
          CODE_RUN: ${{ inputs.code_run || env.LIVARA_CODE_RUN }}
        run: |
          set -euo pipefail
          for run in "$BROWSER_RUN" "$CODE_RUN"; do
            [[ $run =~ ^[0-9]+$ ]]
            test "$(gh api repos/$GH_REPO/actions/runs/$run --jq .conclusion)" = success
          done
          mkdir -p dist/provenance
          gh api repos/$GH_REPO/actions/runs/$BROWSER_RUN > dist/provenance/browser-run.json
          gh api repos/$GH_REPO/actions/runs/$CODE_RUN > dist/provenance/code-run.json
      - name: Prepare disposable hosted runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends python3-fonttools libharfbuzz-bin gnupg gpgv
          df -h
          available=$(df --output=avail -B1 /var/lib/docker | tail -1)
          test "$available" -ge 53687091200 || { echo 'At least 50 GiB free required for assembly and boot tests.' >&2; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.browser_run || github.event.workflow_run.id }}
          name: livara-browser-linux-x64
          path: dist/forks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.code_run || env.LIVARA_CODE_RUN }}
          name: livara-code-linux-x64
          path: dist/forks
      - name: Build live filesystem and ISO
        run: |
          set -euo pipefail
          mkdir -p dist/logs
          bash scripts/assemble-ci-iso.sh --assemble-only 2>&1 | tee dist/logs/iso-build.log
      - name: Boot ISO and run BIOS live-system checks
        run: |
          set -euo pipefail
          bash scripts/boot-ci-iso.sh bios 2>&1 | tee dist/logs/boot-bios.log
      - name: Boot ISO and run UEFI live-system checks
        run: |
          set -euo pipefail
          bash scripts/boot-ci-iso.sh uefi 2>&1 | tee dist/logs/boot-uefi.log
      - name: Prepare verified release download
        run: python3 scripts/package-iso-release.py dist/livara-os-0.1.0-amd64.iso dist/release
      - name: Publish boot-tested preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.1.0-preview.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" --title "Livara OS x86-64 preview — build $GITHUB_RUN_NUMBER" --notes-file dist/release/README.txt
          gh release upload "$RELEASE_TAG" dist/release/* dist/livara-os-0.1.0-packages.txt
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Preserve build, package and boot proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-build-and-boot-proof
          path: |
            dist/logs/
            dist/provenance/
            dist/livara-os-0.1.0-packages.txt
            .build/boot-bios/*.json
            .build/boot-bios/*.png
            .build/boot-bios/*.log
            .build/boot-uefi/*.json
            .build/boot-uefi/*.png
            .build/boot-uefi/*.log
          if-no-files-found: warn
          retention-days: 30
