set default=0
set timeout=1
set timeout_style=hidden
set color_normal=light-gray/black
set color_highlight=black/light-green
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial
if loadfont unicode; then
  insmod all_video
  set gfxmode=auto
  terminal_output gfxterm serial
fi
menuentry "Try Livara OS — Verdant Preview" --hotkey=n {
  linux /casper/vmlinuz boot=casper live-media-path=/casper username=livara hostname=livara noprompt noeject quiet splash ---
  initrd /casper/initrd
}
menuentry "Livara OS — compatibility graphics" --hotkey=s {
  linux /casper/vmlinuz boot=casper live-media-path=/casper username=livara hostname=livara noprompt noeject nomodeset ---
  initrd /casper/initrd
}
menuentry "Livara OS — boot diagnostics (serial)" --hotkey=d {
  linux /casper/vmlinuz boot=casper live-media-path=/casper username=livara hostname=livara noprompt noeject livara.selftest console=tty0 console=ttyS0,115200n8 ---
  initrd /casper/initrd
}

